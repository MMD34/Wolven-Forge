name: Proposer une idée · Suggest an idea
description: Une fonction qui vous aiderait · A feature that would help you
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Votre idée · Your idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Dans quelle situation vous aiderait-elle ? · When would it help you?
