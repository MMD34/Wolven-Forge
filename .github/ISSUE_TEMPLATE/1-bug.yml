name: Report a bug
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        Please never attach your saves or any credentials.
  - type: input
    id: version
    attributes:
      label: Wolven Forge version
      description: Settings › About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: Shown in the game's main menu
      placeholder: "5.01 (Steam)"
  - type: textarea
    id: mods
    attributes:
      label: Mods involved
      description: The mods you were installing, merging or removing, ideally with a link to their Nexus page.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic file (optional)
      description: Drop the file saved with "Export diagnostics…" (Diagnostics workspace) here. It's redacted by default and never contains your saves.
