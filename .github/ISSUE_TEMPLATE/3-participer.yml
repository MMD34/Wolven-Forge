name: Participer au projet · Join the project
description: Corriger un bug ou contribuer au code · Fix a bug or contribute code
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de votre intérêt ! L'accès au code est ouvert au cas par cas. En envoyant une contribution, vous acceptez qu'elle soit intégrée à Wolven Forge.
        Thanks for your interest! Access to the code is granted case by case. By sending a contribution, you agree that it may be included in Wolven Forge.
  - type: textarea
    id: plan
    attributes:
      label: Ce que vous aimeriez faire · What you'd like to do
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Votre expérience (facultatif) · Your experience (optional)
      description: Rust, TypeScript, mods de The Witcher 3… · Rust, TypeScript, The Witcher 3 modding…
